[package]
name = "realfakebluesky-consumer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
atrium-api = { workspace = true }
image = "0.24"
jetstream = { path = "../../jetstream" }
reqwest = { version = "0.12", features = ["stream"] }
regex = "1.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
serde_json = "1.0"
